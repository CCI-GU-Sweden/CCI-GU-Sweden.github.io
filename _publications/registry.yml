      type: journal-article
      year: 2023
    provider: crossref
  abstract:
    text: Establishing a vascular network in biofabricated tissue grafts is essential for ensuring graft
      survival. Such networks are dependent on the ability of the scaffold material to facilitate endothelial
      cell adhesion; however, the clinical translation potential of tissue-engineered scaffolds is hindered
      by the lack of available autologous sources of vascular cells. Here, we present a novel approach
      to achieving autologous endothelialisation in nanocellulose-based scaffolds by using adipose tissue-derived
      vascular cells on nanocellulose-based scaffolds. We used sodium periodate-mediated bioconjugation
      to covalently bind laminin to the scaffold surface and isolated the stromal vascular fraction and
      endothelial progenitor cells (EPCs; CD31+CD45−) from human lipoaspirate. Additionally, we assessed
      the adhesive capacity of scaffold bioconjugation in vitro using both adipose tissue-derived cell
      populations and human umbilical vein endothelial cells. The results showed that the bioconjugated
      scaffold exhibited remarkably higher cell viability and scaffold surface coverage by adhesion regardless
      of cell type, whereas control groups comprising cells on non-bioconjugated scaffolds exhibited minimal
      cell adhesion across all cell types. Furthermore, on culture day 3, EPCs seeded on laminin-bioconjugated
      scaffolds showed positive immunofluorescence staining for the endothelial markers CD31 and CD34,
      suggesting that the scaffolds promoted progenitor differentiation into mature endothelial cells.
      These findings present a possible strategy for generating autologous vasculature and thereby increase
      the clinical relevance of 3D-bioprinted nanocellulose-based constructs.
    source_url: https://doi.org/10.1088/1748-605x/acdebb
    license_url: http://creativecommons.org/licenses/by/4.0
