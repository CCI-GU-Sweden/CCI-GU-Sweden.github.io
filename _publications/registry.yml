      title: 'Smart Microscopy: Current Implementations and a Roadmap for Interoperability'
      type: posted-content
      year: 2025
    provider: crossref
  abstract:
    text: Smart microscopy is transforming life sciences by automating experimental imaging workflows
      and enabling real-time adaptation based on feedback from images and other data streams. This shift
      increases throughput, improves reproducibility, and expands the functional capabilities of microscopes.
      However, the current landscape is highly fragmented. Academic researchers often develop custom solutions
      for specific scientific needs, while industry offerings are typically proprietary and tied to specific
      hardware. This diversity, while fostering innovation, also creates major challenges in interoperability,
      reproducibility, and standardization, which slows progress and adaption. This article presents a
      collaborative effort between academic and industry leaders to survey the current state of smart
      microscopy, highlight representative implementations, and identify common technical and organizational
      barriers. We propose a framework for greater interoperability based on shared standards, modular
      software design, and community-driven development. Our goal is to support collaboration across the
      field and lay the groundwork for a more connected, reusable, and accessible smart microscopy ecosystem.
      We conclude with a call to action for researchers, hardware developers, and institutions to join
      in building an open, interoperable foundation that will unlock the full potential of smart microscopy
      in life science research.
    source_url: https://doi.org/10.1101/2025.08.18.670881
    license_url: http://creativecommons.org/licenses/by/4.0/
