      authors_text: Hui Gu; Chaoyi Gu; Nicolas Locker; Andrew G. Ewing
      journal: Angewandte Chemie International Edition
      year: 2024
      type: journal-article
      publication_url: https://doi.org/10.1002/anie.202400422
  abstract:
    text: An overreactive stress granule (SG) pathway and long‐lived, stable SGs formation are thought
      to participate in the progress of neurodegenerative diseases (NDs). To understand if and how SGs
      contribute to disorders of neurotransmitter release in NDs, we examined the interaction between
      extracellular isolated SGs and vesicles. Amperometry shows that the vesicular content increases
      and dynamics of vesicle opening slow down after vesicles are treated with SGs, suggesting larger
      vesicles are formed. Data from transmission electron microscopy (TEM) clearly shows that a portion
      of large dense‐core vesicles (LDCVs) with double/multiple cores appear, thus confirming that SGs
      induce homotypic fusion between LDCVs. This might be a protective step to help cells to survive
      following high oxidative stress. A hypothetical mechanism is proposed whereby enriched mRNA or protein
      in the shell of SGs is likely to bind intrinsically disordered protein (IDP) regions of vesicle
      associated membrane protein (VAMP) driving a disrupted membrane between two closely buddled vesicles
      to fuse with each other to form double‐core vesicles. Our results show that SGs induce homotypic
      fusion of LDCVs, providing better understanding of how SGs intervene in pathological processes and
      opening a new direction to investigations of SGs involved neurodegenerative disease.
    source_url: https://doi.org/10.1002/anie.202400422
    license_url: http://creativecommons.org/licenses/by/4.0/
