  abstract:
    text: 'Background


      Allergic asthma is associated with airflow obstruction and hyper-responsiveness that arises from
      airway inflammation and remodeling. Cell therapy with mesenchymal stem cells (MSC) has been shown
      to attenuate inflammation in asthma models, and similar effects have recently been observed using
      extracellular vesicles (EV) obtained from these cells. Biologically functional vesicles can also
      be artificially generated from MSC by extruding cells through membranes to produce EV-mimetic nanovesicles
      (NV). In this study, we aimed to determine the effects of different MSC-derived vesicles in a murine
      model of allergic airway inflammation.


      Methods


      EV were obtained through sequential centrifugation of serum-free media conditioned by human bone
      marrow MSC for 24 h. NV were produced through serial extrusion of the whole cells through filters.
      Both types of vesicles underwent density gradient purification and were quantified through nanoparticle
      tracking analysis. C57BL/6 mice were sensitized to ovalbumin (OVA, 8 µg), and then randomly divided
      into the OVA group (intranasally exposed to 100 µg OVA for 5 days) and control group (exposed to
      PBS). The mice were then further divided into groups that received 2 × 109 EV or NV (intranasally
      or intraperitoneally) or PBS immediately following the first OVA exposure.


      Results


      Administration of EV and NV reduced cellularity and eosinophilia in bronchoalveolar lavage (BAL)
      fluid in OVA-sensitized and OVA-exposed mice. In addition, NV treatment resulted in decreased numbers
      of inflammatory cells within the lung tissue, and this was associated with lower levels of Eotaxin-2
      in both BAL fluid and lung tissue. Furthermore, both intranasal and systemic administration of NV
      were effective in reducing inflammatory cells; however, systemic delivery resulted in a greater
      reduction of eosinophilia in the lung tissue.


      Conclusions


      Taken together, our results indicate that MSC-derived NV significantly reduce OVA-induced allergic
      airway inflammation to a level comparable to EV. Thus, cell-derived NV may be a novel EV-mimetic
      therapeutic candidate for treating allergic diseases such as asthma.'
