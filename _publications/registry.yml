      publication_url: https://doi.org/10.1002/jex2.127
  abstract:
    text: Colon cancer is one of the most commonly occurring tumours among both women and men, and over
      the past decades the incidence has been on the rise. As such, the need for biomarker identification
      as well as an understanding of the underlying disease mechanism has never been greater. Extracellular
      vesicles are integral mediators of cell‐to‐cell communication and offer a unique opportunity to
      study the machinery that drives disease progression, and they also function as vectors for potential
      biomarkers. Tumour tissue and healthy mucosal tissue from the colons of ten patients were used to
      isolate tissue‐resident EVs that were subsequently subjected to global quantitative proteomic analysis
      through LC‐MS/MS. In total, more than 2000 proteins were identified, with most of the common EV
      markers being among them. Bioinformatics revealed a clear underrepresentation of proteins involved
      in energy production and cellular adhesion in tumour EVs, while proteins involved in protein biosynthesis
      were overrepresented. Additionally, 53 membrane proteins were found to be significantly upregulated
      in tumour EVs. Among them were several proteins with enzymatic functions that degrade the extracellular
      matrix, and three of these, Fibroblast activating factor (FAP), Cell surface hyaluronidase (CEMIP2),
      as well as Ephrin receptor B3 (EPHB3), were validated and found to be consistent with the global
      quantitative results. These stark differences in the proteomes between healthy and cancerous tissue
      emphasise the importance of the interstitial vesicle secretome as a major player of disease development.
