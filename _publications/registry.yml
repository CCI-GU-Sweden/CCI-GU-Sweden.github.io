  abstract:
    text: 'Summary


      Eosinophilic esophagitis (EoE) and gastroesophageal reflux disease (GERD) share many histopathological
      features; therefore, markers for differentiation are of diagnostic interest and may add to the understanding
      of the underlying mechanisms. The nitrergic system is upregulated in GERD and probably also in EoE.
      Esophageal biopsies of patients with EoE (n = 20), GERD (n = 20), and healthy volunteers (HVs) (n
      = 15) were exposed to antibodies against inducible nitric oxide synthase (iNOS), nitrotyrosine,
      eosinophilic peroxidase, eotaxin-3, and galectin-3. The stained object glasses were randomized,
      digitized, and blindly analyzed regarding the expression of DAB (3,3′-diaminobenzidine) by a protocol
      developed in QuPath software. A statistically significant overexpression of iNOS was observed in
      patients with any of the two inflammatory diseases compared with that in HVs. Eotaxin-3 could differentiate
      HVs versus inflammatory states. Gastroesophageal reflux patients displayed the highest levels of
      nitrotyrosine. Neither iNOS nor nitrotyrosine alone were able to differentiate between the two diseases.
      For that purpose, eosinophil peroxidase was a better candidate, as the mean levels increased stepwise
      from HVs via GERD to EoE. iNOS and nitrotyrosine are significantly overexpressed in patients with
      EoE and GERD compared with healthy controls, but only eosinophil peroxidase could differentiate
      the two types of esophagitis. The implications of the finding of the highest levels of nitrotyrosine
      among gastroesophageal reflux patients are discussed.'
    source_url: https://doi.org/10.1093/dote/doae034
