    provider: crossref
  abstract:
    text: In tumors with WT p53, alternate mechanisms of p53 inactivation are reported. Here, we have
      identified a long noncoding RNA, PITAR ( p 53 I nactivating T RIM28 A ssociated R NA), as an inhibitor
      of p53. PITAR is an oncogenic Cancer/testis lncRNA and is highly expressed in glioblastoma (GBM)
      and glioma stem-like cells (GSC). We establish that TRIM28 mRNA, which encodes a p53-specific E3
      ubiquitin ligase, is a direct target of PITAR. PITAR interaction with TRIM28 RNA stabilized TRIM28
      mRNA, which resulted in increased TRIM28 protein levels and reduced p53 steady-state levels due
      to enhanced p53 ubiquitination. DNA damage activated PITAR , in addition to p53, in a p53-independent
      manner, thus creating an incoherent feedforward loop to inhibit the DNA damage response by p53.
      While PITAR silencing inhibited the growth of WT p53 containing GSCs in vitro and reduced glioma
      tumor growth in vivo, its overexpression enhanced the tumor growth in a TRIM28 -dependent manner
      and promoted resistance to Temozolomide. Thus, we establish an alternate way of p53 inactivation
      by PITAR , which maintains low p53 levels in normal cells and attenuates the DNA damage response
      by p53. Finally, we propose PITAR as a potential GBM therapeutic target.
    source_url: https://doi.org/10.7554/elife.88256
