  abstract:
    text: Extracellular vesicles (EVs) are cell‐produced, membrane‐surrounded vesicles that harbour the
      biological features of donor cells. In the current study, we are the first to isolate and characterize
      EVs isolated from human precision‐cut liver slices (PCLS), obtained from both healthy and metabolic
      dysfunction‐associated steatohepatitis (MASH) cirrhotic livers. PCLS derived from patients can faithfully
      represent disease conditions in humans. EVs were isolated from human PCLS after incubating in normal
      medium or modified medium that mimics the pathophysiological environment of metabolic dysfunction
      associated liver disease (MASLD). MASH PCLS produced higher amounts of EVs compared to healthy PCLS
      (p < 0.001). Mass spectrometry revealed that around 300 proteins were significantly different in
      EVs derived from MASH PCLS versus healthy PCLS (FDR < 0.05), irrespective of the type of medium.
      Significantly changed EV proteins were largely involved in signalling receptor binding function
      and showed potential in promoting fibrosis. In the liver, these ligand‐associated receptors are
      highly expressed in hepatic stellate cells, and the MASH EVs functionally promoted the activation
      of hepatic stellate cells. Furthermore, the amounts of EpCAM and ITGA3 in EVs were positively associated
      with the progression of MASLD, which suggests the use of liver‐derived EVs as potential biomarkers
      for MASLD. Characterization of EVs derived from human PCLS may assist future studies in investigating
      the pathogenesis and identifying liver‐specific EVs as biomarkers of MASLD.
    source_url: https://doi.org/10.1002/jex2.70043
