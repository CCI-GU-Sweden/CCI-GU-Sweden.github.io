  abstract:
    text: In the dynamic landscape of scientific research, imaging core facilities are vital hubs propelling
      collaboration and innovation at the technology development and dissemination frontier. Here, we
      present a collaborative effort led by Global BioImaging (GBI), introducing international recommendations
      geared towards elevating the careers of Imaging Scientists in core facilities. Despite the critical
      role of Imaging Scientists in modern research ecosystems, challenges persist in recognising their
      value, aligning performance metrics and providing avenues for career progression and job security.
      The challenges encompass a mismatch between classic academic career paths and service‐oriented roles,
      resulting in a lack of understanding regarding the value and impact of Imaging Scientists and core
      facilities and how to evaluate them properly. They further include challenges around sustainability,
      dedicated training opportunities and the recruitment and retention of talent. Structured across
      these interrelated sections, the recommendations within this publication aim to propose globally
      applicable solutions to navigate these challenges. These recommendations apply equally to colleagues
      working in other core facilities and research institutions through which access to technologies
      is facilitated and supported. This publication emphasises the pivotal role of Imaging Scientists
      in advancing research programs and presents a blueprint for fostering their career progression within
      institutions all around the world.
    source_url: https://doi.org/10.1111/jmi.13307
    license_url: http://creativecommons.org/licenses/by/4.0/
