      title: Modelling POLG mutations in mice unravels a critical role of POLγΒ in regulating phenotypic
        severity
      type: journal-article
      year: 2025
    provider: crossref
  abstract:
    text: DNA polymerase γ (POLγ), responsible for mitochondrial DNA replication, consists of a catalytic
      POLγA subunit and two accessory POLγB subunits. Mutations in POLG, which encodes POLγA, lead to
      various mitochondrial diseases. We investigated the most common POLG mutations (A467T, W748S, G848S,
      Y955C) by characterizing human and mouse POLγ variants. Our data reveal that these mutations significantly
      impair POLγ activities, with mouse variants exhibiting milder defects. Cryogenic electron microscopy
      highlighted structural differences between human and mouse POLγ, particularly in the POLγB subunit,
      which may explain the higher activity of mouse POLγ and the reduced severity of mutations in mice.
      We further generated a panel of mouse models mirroring common human POLG mutations, providing crucial
      insights into the pathogenesis of POLG-related disorders and establishing robust models for therapeutic
      development. Our findings emphasize the importance of POLγB in modulating the severity of POLG mutations.
    source_url: https://doi.org/10.1038/s41467-025-60059-y
