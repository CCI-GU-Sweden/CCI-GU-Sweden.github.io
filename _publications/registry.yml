  abstract:
    text: Multimodal bioimaging is a broad term used to describe experimental workflows that employ two
      or more different imaging modalities. Such approaches have been in use across life science domains
      for several years but these remain relatively limited in scope, in part due to the complexity of
      undertaking these types of analysis. Expanding these workflows to encompass diverse, emerging technology
      holds potential to revolutionize our understanding of spatial biology. In this perspective we reflect
      on the instrument and workflows in current use, emerging areas to consider and our experience of
      the barriers to broader adoption and progress. We propose several enabling solutions across the
      different challenge areas, emerging opportunities for consideration and highlight some of the key
      community activities to help move the field forward.
    source_url: https://doi.org/10.1038/s44303-024-00010-w
    license_url: https://creativecommons.org/licenses/by/4.0
