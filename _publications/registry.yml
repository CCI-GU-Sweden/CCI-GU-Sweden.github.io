        Mickael Andersson; Jonas Boström; Hanna Alalam; Ali M Harandi; Anne Farewell; Jan Lötvall
      journal: Journal of Nanobiotechnology
      year: 2023
      type: journal-article
      publication_url: https://doi.org/10.1186/s12951-023-01928-w
  abstract:
    text: The development of vaccines based on outer membrane vesicles (OMV) that naturally bud off from
      bacteria is an evolving field in infectious diseases. However, the inherent inflammatory nature
      of OMV limits their use as human vaccines. This study employed an engineered vesicle technology
      to develop synthetic bacterial vesicles (SyBV) that activate the immune system without the severe
      immunotoxicity of OMV. SyBV were generated from bacterial membranes through treatment with detergent
      and ionic stress. SyBV induced less inflammatory responses in macrophages and in mice compared to
      natural OMV. Immunization with SyBV or OMV induced comparable antigen-specific adaptive immunity.
      Specifically, immunization with Pseudomonas aeruginosa-derived SyBV protected mice against bacterial
      challenge, and this was accompanied by significant reduction in lung cell infiltration and inflammatory
      cytokines. Further, immunization with Escherichia coli-derived SyBV protected mice against E. coli
      sepsis, comparable to OMV-immunized group. The protective activity of SyBV was driven by the stimulation
      of B-cell and T-cell immunity. Also, SyBV were engineered to display the SARS-CoV-2 S1 protein on
      their surface, and these vesicles induced specific S1 protein antibody and T-cell responses. Collectively,
      these results demonstrate that SyBV may be a safe and efficient vaccine platform for the prevention
      of bacterial and viral infections.
    source_url: https://doi.org/10.1186/s12951-023-01928-w
    license_url: https://creativecommons.org/licenses/by/4.0
