  abstract:
    text: To investigate how the fatty acid composition of brain phospholipids influences brain‐specific
      processes, we leveraged the AdipoR2 (adiponectin receptor 2) knockout mouse model in which the brain
      is enlarged, and cellular membranes are excessively rich in saturated fatty acids. Lipidomics analysis
      of brains at 2, 7, and 18 months of age showed that phosphatidylcholines, which make up about two‐thirds
      of all cerebrum membrane lipids, contain a gross excess of saturated fatty acids in AdipoR2 knockout
      mice, and that this is mostly attributed to an excess palmitic acid (C16:0) at the expense of oleic
      acid (C18:1), consistent with a defect in fatty acid desaturation and elongation in the mutant.
      Specifically, there was a ~12% increase in the overall saturated fatty acid content within phosphatidylcholines
      and a ~30% increase in phosphatidylcholines containing two palmitic acids. Phosphatidylethanolamines,
      sphingomyelins, ceramides, lactosylceramides, and dihydroceramides also showed an excess of saturated
      fatty acids in the AdipoR2 knockout mice while nervonic acid (C24:1) was enriched at the expense
      of shorter saturated fatty acids in glyceroceramides. Similar defects were found in the cerebellum
      and myelin sheaths. Histology showed that cell density is lower in the cerebrum of AdipoR2 knockout
      mice, but electron microscopy did not detect reproducible defects in the ultrastructure of cerebrum
      neurons, though proteomics analysis showed an enrichment of electron transport chain proteins in
      the cerebellum. Behavioral tests showed that older (33 weeks old) AdipoR2 knockout mice are hyperactive
      and anxious compared to control mice of a similar age. Also, in contrast to control mice, the AdipoR2
      knockout mice do not gain weight in old age but do have normal lifespans. We conclude that an excess
      fatty acid saturation in brain phospholipids is accompanied by hyperactivity but seems otherwise
      well tolerated.
