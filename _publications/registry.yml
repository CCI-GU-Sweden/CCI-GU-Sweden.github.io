  abstract:
    text: Protoberberine alkaloids and benzophenanthridine alkaloids (BZDAs) are subgroups of benzylisoquinoline
      alkaloids (BIAs), which represent a diverse class of plant-specialized natural metabolites with
      many pharmacological properties. Microbial biosynthesis has been allowed for accessibility and scalable
      production of high-value BIAs. Here, we engineer Saccharomyces cerevisiae to de novo produce a series
      of protoberberines and BZDAs, including palmatine, berberine, chelerythrine, sanguinarine and chelirubine.
      An ER compartmentalization strategy is developed to improve vacuole protein berberine bridge enzyme
      (BBE) activity, resulting in >200% increase on the production of the key intermediate ( S )-scoulerine.
      Another promiscuous vacuole protein dihydrobenzophenanthridine oxidase (DBOX) has been identified
      to catalyze two-electron oxidation on various tetrahydroprotoberberines at N7-C8 position and dihydrobenzophenanthridine
      alkaloids. Furthermore, cytosolically expressed DBOX can alleviate the limitation on BBE. This study
      highlights the potential of microbial cell factories for the biosynthesis of a diverse group of
      BIAs through engineering of heterologous plant enzymes.
