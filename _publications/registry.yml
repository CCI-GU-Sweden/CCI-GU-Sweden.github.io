      authors_text: Agnieszka Podraza-Farhanieh; Dorota Raj; Gautam Kao; Peter Naredi
      journal: Development
      publication_url: https://doi.org/10.1242/dev.201035
      title: A proinsulin-dependent interaction between ENPL-1 and ASNA-1 in neurons is required to maintain
        insulin secretion in C. elegans
      type: journal-article
      year: 2023
    provider: crossref
  abstract:
    text: Neuropeptides, including insulin, are important regulators of physiological functions of the
      organisms. Trafficking through the Golgi is crucial for the regulation of secretion of insulin-like
      peptides. ASNA-1 (TRC40) and ENPL-1 (GRP94) are conserved insulin secretion regulators in Caenorhabditis
      elegans (and mammals), and mouse Grp94 mutants display type 2 diabetes. ENPL-1/GRP94 binds proinsulin
      and regulates proinsulin levels in C. elegans and mammalian cells. Here, we have found that ASNA-1
      and ENPL-1 cooperate to regulate insulin secretion in worms via a physical interaction that is independent
      of the insulin-binding site of ENPL-1. The interaction occurs in DAF-28/insulin-expressing neurons
      and is sensitive to changes in DAF-28 pro-peptide levels. Consistently, ASNA-1 acted in neurons
      to promote DAF-28/insulin secretion. The chaperone form of ASNA-1 was likely the interaction partner
      of ENPL-1. Loss of asna-1 disrupted Golgi trafficking pathways. ASNA-1 localization to the Golgi
      was affected in enpl-1 mutants and ENPL-1 overexpression partially bypassed the ASNA-1 requirement.
      Taken together, we find a functional interaction between ENPL-1 and ASNA-1 that is necessary to
      maintain proper insulin secretion in C. elegans and provides insights into how their loss might
      cause diabetes in mammals.
    source_url: https://doi.org/10.1242/dev.201035
