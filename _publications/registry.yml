      title: The crucial role of bioimage analysts in scientific research and publication
      type: journal-article
      year: 2024
    provider: crossref
  abstract:
    text: Bioimage analysis (BIA), a crucial discipline in biological research, overcomes the limitations
      of subjective analysis in microscopy through the creation and application of quantitative and reproducible
      methods. The establishment of dedicated BIA support within academic institutions is vital to improving
      research quality and efficiency and can significantly advance scientific discovery. However, a lack
      of training resources, limited career paths and insufficient recognition of the contributions made
      by bioimage analysts prevent the full realization of this potential. This Perspective – the result
      of the recent The Company of Biologists Workshop ‘Effectively Communicating Bioimage Analysis’,
      which aimed to summarize the global BIA landscape, categorize obstacles and offer possible solutions
      – proposes strategies to bring about a cultural shift towards recognizing the value of BIA by standardizing
      tools, improving training and encouraging formal credit for contributions. We also advocate for
      increased funding, standardized practices and enhanced collaboration, and we conclude with a call
      to action for all stakeholders to join efforts in advancing BIA.
    source_url: https://doi.org/10.1242/jcs.262322
    license_url: http://creativecommons.org/licenses/by/4.0
  cci_involvement: scientific-collaboration
